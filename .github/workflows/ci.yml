name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - multilang-v0.3
      - "codex/**"

permissions:
  contents: read

env:
  APP_ENV: test
  FLASK_ENV: testing
  SECRET_KEY: ci-non-default-secret-change-before-prod
  AUTH_SECRET_KEY: ci-non-default-auth-secret-change-before-prod
  LLM_PROVIDER: ollama
  LLM_MODEL_NAME: ci-dummy-model
  LLM_API_KEY: ci-dummy-key
  LLM_BASE_URL: http://127.0.0.1:11434/v1
  OPENAI_API_KEY: ci-dummy-key
  OPENAI_API_BASE_URL: http://127.0.0.1:11434/v1
  EMBEDDING_PROVIDER: ollama
  EMBEDDING_MODEL: ci-dummy-embedding
  EMBEDDING_BASE_URL: http://127.0.0.1:11434
  GRAPH_DB_MODE: local
  NEO4J_URI: bolt://127.0.0.1:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ci-dummy-password
  RATE_LIMIT_ENABLED: "false"

jobs:
  secret-hygiene:
    name: Secret Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for committed secret-like tokens
        shell: bash
        run: |
          set -euo pipefail
          tracked_env_files="$(git ls-files '.env*' | grep -vE '^\.env(\.example|\.dev\.example)$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo "::error::Tracked local environment file(s) detected. Keep only .env.example and .env.dev.example in Git."
            echo "$tracked_env_files"
            exit 1
          fi

          tracked_runtime_files="$(git ls-files 'backend/uploads/**' 'backend/app/uploads/**' || true)"
          if [ -n "$tracked_runtime_files" ]; then
            echo "::error::Tracked runtime upload/settings/report files detected. Move generated runtime data out of Git."
            echo "$tracked_runtime_files"
            exit 1
          fi

          pattern='(sk-[A-Za-z0-9_=-]{20,}|sk-ant-[A-Za-z0-9_=-]{20,}|gsk_[A-Za-z0-9_=-]{20,}|sk-or-[A-Za-z0-9_=-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA)? ?PRIVATE KEY-----)'
          if git grep -nE "$pattern" -- \
            ':!.env.example' \
            ':!.env.dev.example' \
            ':!frontend/package-lock.json'
          then
            echo "::error::Potential committed secret found. Replace it with a placeholder or move it to GitHub Secrets."
            exit 1
          fi

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: secret-hygiene
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run backend contract and smoke tests
        run: python -m pytest tests

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: secret-hygiene
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: secret-hygiene
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint, typecheck, unit tests, and analytics tests
        run: npm run test:frontend

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - secret-hygiene
      - frontend-build
      - frontend-quality
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mocked e2e smoke tests
        run: npm run test:e2e -- --project=chromium --workers=1
